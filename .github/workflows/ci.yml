# Checks every push to main and every pull request. Needs no AWS access: the tests use
# fake models and fake AWS clients.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only access to the repository; nothing in CI needs more.
permissions:
  contents: read

# A newer push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04 # pinned, so the OS changes only when we choose
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0 # this action publishes only full version tags
        with:
          version: "0.12.23"
          enable-cache: true

      # Exactly the versions in uv.lock. On Linux that includes the CPU-only PyTorch.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Test
        run: uv run pytest -q

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-24.04 # pinned, so the OS changes only when we choose
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"

      - name: Check formatting
        run: terraform fmt -check -recursive

      # -backend=false: check the code without touching any state or AWS account.
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  # CD: after both checks pass on a push to main, build the image and push it to ECR.
  deploy:
    name: Build and push image
    needs: [test, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm # ARM64, the same architecture as the Fargate task
    permissions:
      contents: read
      id-token: write # lets this job request GitHub's OIDC token, which AWS trusts
    steps:
      - uses: actions/checkout@v7

      # Exchanges GitHub's OIDC token for short-lived AWS credentials. No AWS keys are
      # stored in GitHub; the role only trusts this repository's main branch.
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      # Tagged with the commit (traceable to the exact code) and latest (what the task
      # definition runs). Layers are cached between runs, so unchanged ones rebuild fast.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false # a single plain image, as in the local push routine
          sbom: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/ml-debug-agent:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/ml-debug-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
