[project]
name = "ml-debug-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mfetter", email = "miandfeter@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
ml-debug-agent = "ml_debug_agent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
